spring.application.name=Categoria
server.port=8081

eureka.client.enabled=true

spring.datasource.url=jdbc:mysql://localhost:3306/db_sonidovivo
spring.datasource.username=root
spring.datasource.password=

spring.flyway.enabled=true
spring.flyway.repair=true
spring.flyway.repair-on-migrate=true
spring.flyway.table=flyway_schema_categoria
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

springdoc.api-docs.enabled=true
springdoc.api-docs.path=/api/categoria/v3/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/api/categoria/doc/swagger-ui.html
server.forward-headers-strategy=framework